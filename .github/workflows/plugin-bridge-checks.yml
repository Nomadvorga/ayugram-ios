name: Plugin bridge checks

on:
  push:
    branches: [plugins-test]
    paths:
      - 'submodules/AyuPluginBridge/**'
      - 'tools/plugin_inspector/**'
      - 'third-party/ayu-python/**'
      - '.github/workflows/plugin-bridge-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Test static inspector
        run: python3 -B -m unittest tools.plugin_inspector.tests -v
      - name: Test SDK contract
        run: python3 -B -m unittest discover -s submodules/AyuPluginBridge/Tests/Python -v
      - name: Test runtime packaging
        run: python3 -B -m unittest submodules.AyuPluginBridge.Build.prepare_test submodules.AyuPluginBridge.Build.verify_ipa_test -v
      - name: Inspect bundled smoke fixture without execution
        run: python3 -B -m tools.plugin_inspector submodules/AyuPluginBridge/Resources/bridge_smoke.plugin --format json
