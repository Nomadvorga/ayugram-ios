name: Build IPA

on:
  push:
    branches: [master, plugins-test]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Device IPA or simulator build + isolated onboarding smoke (debug is faster)'
        type: choice
        options:
          - debug_arm64
          - release_arm64
          - debug_sim_arm64
          - release_sim_arm64
        default: debug_arm64

concurrency:
  group: build-ipa-${{ github.ref }}-${{ inputs.configuration || 'debug_arm64' }}
  # Finish the active compiler run while the next port snapshot waits for its turn.
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 355
    env:
      CONFIGURATION: ${{ inputs.configuration || 'debug_arm64' }}
      DISK_CACHE: /Users/runner/bazel-disk-cache/${{ inputs.configuration || 'debug_arm64' }}
      REPO_CACHE: /Users/runner/bazel-repo-cache
      # GitHub rejects cache entries above 10 GB; the disk cache compresses well.
      DISK_CACHE_LIMIT_GB: '9'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          REQUIRED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_${REQUIRED}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${REQUIRED}.app/Contents/Developer"
            echo "override=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Xcode ${REQUIRED} is not installed on this runner, using the default one"
            echo "override=--overrideXcodeVersion" >> "$GITHUB_OUTPUT"
          fi
          ACTUAL=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "version=${ACTUAL}" >> "$GITHUB_OUTPUT"
          echo "Using Xcode ${ACTUAL}"

      # Xcode installs stay: Bazel's xcode_configure probes every Xcode it finds.
      - name: Free disk space in background
        run: |
          (sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/.ghcup") > /dev/null 2>&1 &
          df -h /

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ env.CONFIGURATION }}-xcode${{ steps.xcode.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-${{ env.CONFIGURATION }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Restore Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ${{ env.REPO_CACHE }}
          key: bazel-repo-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-repo-

      - name: Prepare build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          set -euo pipefail
          if [ -z "${API_ID}" ] || [ -z "${API_HASH}" ]; then
            echo "::warning::API_ID / API_HASH secrets are not set: the IPA will build, but login will not work"
            API_ID=0
            API_HASH=00000000000000000000000000000000
          fi
          mkdir -p "$DISK_CACHE" "$REPO_CACHE" build-input
          # bundle_id and team_id must match the profiles in build-system/fake-codesigning;
          # the IPA is re-signed with your own Apple ID by Sideloadly / AltStore.
          cat > build-input/ci-configuration.json <<EOF
          {
            "sg_config": "",
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${API_ID}",
            "api_hash": "${API_HASH}",
            "team_id": "C67CF9S4VU",
            "is_internal_build": "false",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          cat > "$HOME/.bazelrc" <<EOF
          common --repository_cache=${REPO_CACHE}
          build --show_progress_rate_limit=60
          build --keep_going
          EOF
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Test Python packaging helpers (offline fixtures)
        run: |
          python3 -m unittest \
            submodules.AyuPluginBridge.Build.prepare_test \
            submodules.AyuPluginBridge.Build.verify_ipa_test -v

      - name: Build
        id: build
        timeout-minutes: 320
        run: |
          set -euo pipefail
          # The smoke rejects an IPA older than this successful build invocation.
          if [[ "$CONFIGURATION" == *_sim_arm64 ]]; then
            python3 - <<'PY'
          import pathlib, time
          marker = pathlib.Path("build/simulator-build-start.txt")
          marker.parent.mkdir(parents=True, exist_ok=True)
          marker.write_text(str(time.time()))
          PY
          fi
          BUILD_NUMBER=$(( $(cat build_number_offset) + ${{ github.run_number }} ))
          EXTRA_ARGS=""
          if [ "$CONFIGURATION" = "release_arm64" ]; then
            EXTRA_ARGS="--enableParallelSwiftmoduleGeneration"
          fi
          python3 -u build-system/Make/Make.py \
            ${{ steps.xcode.outputs.override }} \
            --cacheDir="$DISK_CACHE" \
            build \
            --configurationPath=build-input/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts \
            $EXTRA_ARGS
          if [[ "$CONFIGURATION" == *_sim_arm64 ]]; then
            # Make.py copies this exact output after a successful build; never pick a stale glob match.
            mv build/artifacts/Swiftgram.ipa build/artifacts/AyuGram.ipa
          else
            for ipa in build/artifacts/*.ipa; do
              [ "$ipa" = build/artifacts/AyuGram.ipa ] || mv "$ipa" build/artifacts/AyuGram.ipa
            done
          fi

      - name: Simulator onboarding smoke
        if: success() && contains(env.CONFIGURATION, '_sim_arm64')
        timeout-minutes: 12
        run: |
          python3 tools/extera_simulator_smoke.py \
            --ipa build/artifacts/AyuGram.ipa \
            --build-start-file build/simulator-build-start.txt \
            --output build/simulator-validation

      - name: Upload simulator evidence
        if: always() && contains(env.CONFIGURATION, '_sim_arm64')
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-simulator-evidence-${{ env.CONFIGURATION }}-${{ github.run_number }}
          path: build/simulator-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify packaged Python dylibs before upload
        run: python3 third-party/ayu-python/verify_ipa.py build/artifacts/AyuGram.ipa

      - name: Upload IPA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-${{ env.CONFIGURATION }}-${{ github.run_number }}
          path: build/artifacts/AyuGram.ipa
          compression-level: 0
          retention-days: 14

      - name: Trim Bazel disk cache (oldest entries first)
        if: always()
        run: |
          python3 - "$DISK_CACHE" "$DISK_CACHE_LIMIT_GB" <<'EOF'
          import os, sys
          root, limit = sys.argv[1], int(sys.argv[2]) * 1024 ** 3
          files, total = [], 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  path = os.path.join(dirpath, name)
                  try:
                      st = os.stat(path)
                  except FileNotFoundError:
                      continue
                  files.append((st.st_mtime, st.st_size, path))
                  total += st.st_size
          files.sort()
          for _, size, path in files:
              if total <= limit:
                  break
              os.remove(path)
              total -= size
          print(f"disk cache: {total / 1024 ** 3:.2f} GB")
          EOF

      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE }}
          key: bazel-disk-${{ env.CONFIGURATION }}-xcode${{ steps.xcode.outputs.version }}-${{ github.run_id }}

      - name: Delete older disk caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: bazel-disk-${{ env.CONFIGURATION }}-
          CURRENT: bazel-disk-${{ env.CONFIGURATION }}-xcode${{ steps.xcode.outputs.version }}-${{ github.run_id }}
        run: |
          KEYS=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          if ! grep -qx "$CURRENT" <<< "$KEYS"; then
            echo "Current cache was not saved, keeping the older ones"
            exit 0
          fi
          grep -vx "$CURRENT" <<< "$KEYS" | while read -r key; do
            [ -n "$key" ] && gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
          done
