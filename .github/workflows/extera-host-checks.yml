name: exteraGram host checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'MODULE.bazel'
      - 'Swiftgram/SGSimpleSettings/**'
      - 'Swiftgram/SGSettingsUI/BUILD'
      - 'Swiftgram/SGMath/**'
      - 'Swiftgram/SGItemListUI/Sources/SliderPercentageItem.swift'
      - 'Swiftgram/SGStrings/Strings/en.lproj/SGLocalizable.strings'
      - 'Swiftgram/SGStrings/Strings/ru.lproj/SGLocalizable.strings'
      - 'Swiftgram/SGSettingsUI/Sources/Extera*.swift'
      - 'tools/check_extera_localizations.py'
      - 'tools/run_extera_xctests.py'
      - 'submodules/TelegramUI/Sources/ExteraMath*.swift'
      - 'submodules/TelegramUI/Sources/ExteraLyrics*Parser.swift'
      - 'submodules/GalleryUI/Sources/ExteraImageSearch*.swift'
      - 'submodules/TelegramCore/Sources/TelegramEngine/Messages/ExteraTakeout*.swift'
      - 'submodules/VoskNative/**'
      - 'submodules/Media/VoskSpeech/**'
      - 'submodules/Media/VoskSpeechAudio/**'
      - 'submodules/Media/LocalAudioTranscription/Sources/VoskTranscriptionResult.swift'
      - 'submodules/MediaPlayer/Sources/FFMpegAudioFrameDecoder.swift'
      - 'submodules/MediaPlayer/Sources/SoftwareVideoSource.swift'
      - 'submodules/MediaPlayer/Tests/SoftwareAudioTranscriptionDrainTests.swift'
      - 'submodules/FFMpegBinding/Public/FFMpegBinding/FFMpegAVCodecContext.h'
      - 'submodules/FFMpegBinding/Public/FFMpegBinding/FFMpegAVFormatContext.h'
      - 'submodules/FFMpegBinding/Public/FFMpegBinding/FFMpegSWResample.h'
      - 'submodules/FFMpegBinding/Sources/FFMpegAVCodecContext.m'
      - 'submodules/FFMpegBinding/Sources/FFMpegAVFormatContext.m'
      - 'submodules/FFMpegBinding/Sources/FFMpegSWResample.m'
      - 'submodules/TelegramUI/Components/Chat/ChatMessageInteractiveFileNode/**'
      - 'Tests/Extera*/**'
      - 'docs/validation/**'
      - '.github/workflows/extera-host-checks.yml'

permissions:
  contents: read

jobs:
  production-models:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Calculator and conversions
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py \
            submodules/TelegramUI/Sources/ExteraMathEngine.swift \
            submodules/TelegramUI/Sources/ExteraMathUnits.swift \
            submodules/TelegramUI/Sources/ExteraMathTimeZones.swift \
            submodules/TelegramUI/Sources/ExteraMathCurrencyRates.swift \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraMathSettings.swift \
            Swiftgram/SGMath/Sources/ExteraMathPreferences.swift \
            Tests/ExteraMath/ExteraMathEngineTests.swift \
            Tests/ExteraMath/ExteraMathSettingsTests.swift
      - name: Lyrics parsers
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          swiftc \
            submodules/TelegramUI/Sources/ExteraLyricsParser.swift \
            submodules/TelegramUI/Sources/ExteraLyricsTTMLParser.swift \
            Tests/ExteraLyrics/main.swift \
            -o "$RUNNER_TEMP/extera-lyrics-tests"
          "$RUNNER_TEMP/extera-lyrics-tests"
      - name: Settings serialization and validators
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 docs/validation/check_extera_backup.py
          python3 tools/check_extera_localizations.py
          python3 docs/validation/run_extera_backup_validation.py
          python3 docs/validation/run_extera_ai_backup_validation.py
          python3 docs/validation/run_ayu_settings_store_validation.py
      - name: Zalgo filter
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/ExteraZalgoFilter.swift \
            Tests/ExteraZalgo/ExteraZalgoFilterTests.swift
      - name: Durable explicit read queue
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            submodules/TelegramCore/Sources/Network/AyuExplicitReadQueue.swift \
            submodules/TelegramCore/Tests/AyuExplicitRead/AyuExplicitReadQueueTests.swift
      - name: Local feed persistence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          TSAN_OPTIONS=halt_on_error=1 python3 tools/run_extera_xctests.py --sanitize=thread --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraFeedSettings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraFeedHistoryPolicy.swift \
            Tests/ExteraFeed/ExteraFeedSettingsTests.swift
      - name: Navigation persistence and strict import
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/ExteraNavigationSettings.swift \
            Tests/ExteraNavigation/ExteraNavigationSettingsTests.swift
      - name: UI icon pack persistence
        if: ${{ !cancelled() }}
        run: python3 Tests/ExteraUIIcons/run_host_tests.py
      - name: Quick admin header policy and persistence
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/ExteraAdminSettings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraAdminHeaderPolicy.swift \
            Tests/ExteraAdmin/ExteraAdminSettingsTests.swift \
            Tests/ExteraAdmin/ExteraAdminHeaderPolicyTests.swift
      - name: Other composition and payment destination policy
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/ExteraOtherSettingsModel.swift \
            Tests/ExteraOther/ExteraOtherSettingsModelTests.swift
      - name: Native chat playback settings
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraChatMediaSettings.swift \
            Tests/ExteraNativeChat/ExteraChatMediaSettingsTests.swift
      - name: Style persistence and normalization
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraStyleSettings.swift \
            Swiftgram/SGSimpleSettings/Tests/ExteraStyleSettingsTests.swift
      - name: Camera zoom and volume policy
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 Tests/ExteraMedia/verify_integration.py
          python3 Tests/ExteraMedia/run_model_tests.py
      - name: Energy settings and power policy
        if: ${{ !cancelled() }}
        run: |
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraEnergySettings.swift \
            Tests/ExteraEnergy/ExteraEnergySettingsTests.swift
      - name: Chat-list gestures and distance units
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraChatAppearanceSettings.swift \
            Tests/ExteraChatAppearance/ExteraChatAppearanceSettingsTests.swift
          python3 Tests/ExteraChatAppearance/run_distance_tests.py --sanitize=thread
      - name: Speech policy and offline model lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 Tests/ExteraSpeech/verify_integration.py
          python3 Tests/ExteraSpeech/run_host_tests.py
      - name: Vosk catalogue, archive safety and model lifecycle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 Tests/ExteraVosk/verify_catalogue.py
          python3 Tests/ExteraVosk/run_native_tests.py
          python3 Tests/ExteraVosk/run_host_tests.py
      - name: AI generation and response formatting
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraAISettings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraAIClient.swift \
            Tests/ExteraAI/ExteraAIClientTests.swift
      - name: HTTP pill models
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -warnings-as-errors -parse-as-library \
            Swiftgram/SGSimpleSettings/Sources/ExteraPillSettings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraPillStrings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraPillStackSettings.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraPillParity.swift \
            Tests/ExteraPills/ExteraPillHostTests.swift \
            -o "$RUNNER_TEMP/extera-pill-tests"
          "$RUNNER_TEMP/extera-pill-tests"
      - name: Sticker settings and geometry
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          swiftc -swift-version 5 -warnings-as-errors -parse-as-library \
            Swiftgram/SGSimpleSettings/Sources/AyuSettingsStore.swift \
            Swiftgram/SGSimpleSettings/Sources/ExteraStickerSettings.swift \
            Tests/ExteraStickers/ExteraStickerHostTests.swift \
            -o "$RUNNER_TEMP/extera-sticker-tests"
          "$RUNNER_TEMP/extera-sticker-tests"
      - name: Image search protocol
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/run_extera_xctests.py --warnings-as-errors \
            submodules/GalleryUI/Sources/ExteraImageSearchProtocol.swift \
            Tests/ExteraImageSearch/ExteraImageSearchProtocolTests.swift
      - name: Takeout serialization and ZIP
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          swiftc \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/ExteraTakeoutModels.swift \
            submodules/TelegramCore/Sources/TelegramEngine/Messages/ExteraTakeoutWriter.swift \
            Tests/ExteraTakeout/main.swift \
            -o "$RUNNER_TEMP/extera-takeout-tests"
          "$RUNNER_TEMP/extera-takeout-tests" "$RUNNER_TEMP/extera-takeout-fixture.zip"
          python3 Tests/ExteraTakeout/validate_source.py "$RUNNER_TEMP/extera-takeout-fixture.zip"
